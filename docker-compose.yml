services:
  db:
    image: postgres:16-alpine
    container_name: eve_healthcare_db
    restart: always
    environment:
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: eve_password
      POSTGRES_DB: eve_healthcare
    ports:
      # Maps host port 5434 to container port 5432 (5432 is local postgres, 5433 is another container)
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: eve_healthcare_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://eve_user:eve_password@db:5432/eve_healthcare
      - SECRET_KEY=dev-secret-key-32-chars-long-eve-healthcare-backend
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
